name: Update live slate

on:
  schedule:
    # Weekday 11:15 UTC ≈ 5:15 AM America/Denver
    - cron: "15 11 * * 1-5"
  workflow_dispatch:

jobs:
  refresh-scores:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pandas numpy
      - name: Refresh scores
        run: python -m elo_lab.workflows.live_slate --sport all
      - name: Commit slate if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl data/nhl data/nba data/slate_status.json
          if git diff --staged --quiet; then
            echo "No score changes"
          else
            git commit -m "chore: refresh live slate scores"
            git push
          fi
